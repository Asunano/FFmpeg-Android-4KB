name: upstream-watch
# 定时检查官方 FFmpeg 新版本 tag。
#
# 为什么不用 release 事件：FFmpeg 官方在 ffmpeg.org 发版，GitHub 上的
# FFmpeg/FFmpeg 只是代码镜像，**releases 列表是空的**（无 release 对象）；
# 且 fork 也收不到上游事件。唯一可靠信号 = 官方 git tag（nX.Y / nX.Y.Z）。
# 版本号带 n 前缀、纯数字结尾才算正式版（n8.0.3 ✓ / n8.0.git ✗ 开发线）。

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 3:00（北京 11:00）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 查官方最新正式 tag 并比对已构建
        id: check
        run: |
          # 只追 release/8.0 稳定线（API 稳定，桥无需随大版本改动）。
          # 取该分支上全部 n8.0.x tag，过滤正式版，取版本号最大的一个。
          LATEST=$(curl -sf "https://api.github.com/repos/FFmpeg/FFmpeg/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E '^n8\.0\.[0-9]+$' \
            | sort -V | tail -1)
          [ -n "$LATEST" ] || { echo "未取到官方 tag"; exit 1; }
          echo "追踪线: release/8.0，最新正式 tag: $LATEST"
          DONE=$(git ls-remote --tags origin | awk -F'refs/tags/' '{print $2}' | grep -v '\^{}' | sed -E 's/-r[0-9]+$//' | sort -u)
          if echo "$DONE" | grep -qx "$LATEST"; then
            echo "已构建过 $LATEST"
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "新版本: $LATEST（已构建：$(echo $DONE | tr '\n' ' ')）"
            echo "new=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: 触发 release-build
        if: steps.check.outputs.new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-build.yml',
              ref: 'master',
              inputs: { ffmpeg_ref: '${{ steps.check.outputs.tag }}', tag_suffix: 'r1' }
            });
            console.log('已触发: ' + '${{ steps.check.outputs.tag }}');
