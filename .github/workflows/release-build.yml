name: release-build
# 构建指定官方 tag 的 FFmpeg + 通用桥 → 打 tag 发 Release。
# 自动触发由 upstream-watch.yml（每日轮询官方 tag，fork 收不到上游事件且
# FFmpeg/FFmpeg 镜像无 release 对象）。本 workflow 也可手动跑。

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: 'FFmpeg 官方 tag（如 n8.0.3；留空=本仓库 master 快照）'
        required: false
        default: ''
      tag_suffix:
        description: 'tag 后缀（默认 r1；同版本重跑递增 r2/r3…）'
        required: false
        default: 'r1'

permissions:
  contents: write   # 打 tag / 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [common, min]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: 钉死 NDK r27b（避免 runner 升级导致产物漂移）
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27b" >> $GITHUB_ENV

      - name: 确定源码 ref 与版本号
        id: ver
        run: |
          REF="${{ inputs.ffmpeg_ref || 'master' }}"
          if [ "$REF" = "master" ]; then
            VER="master-$(date +%Y%m%d)"
          else
            VER="${REF#n}"   # n8.0.3 → 8.0.3
          fi
          SUFFIX="${{ inputs.tag_suffix || 'r1' }}"
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=${REF}-${SUFFIX}" >> $GITHUB_OUTPUT
          echo "源码 ref=$REF  版本=$VER  tag=${REF}-${SUFFIX}"

      - name: 切换到指定源码 ref 并恢复构建层
        if: inputs.ffmpeg_ref != ''
        run: |
          REF="${{ inputs.ffmpeg_ref }}"
          ORIG=$(git rev-parse HEAD)          # 本仓库 master（构建层所在）
          # 官方 tag 通常不在 fork 的引用里，直接摸上游
          git remote add upstream https://github.com/FFmpeg/FFmpeg.git 2>/dev/null || true
          git fetch --depth=1 upstream "refs/tags/${REF}:refs/tags/${REF}"
          git checkout "$REF"
          # 关键：checkout 到上游 tag 后工作树里没有 android/ ，必须把构建层取回，
          # 否则 `bash android/build.sh` 直接 127（No such file or directory）。
          git checkout "$ORIG" -- android/ .github/
          [ -f android/build.sh ] || { echo "FAIL: 构建层 android/build.sh 未恢复"; exit 1; }
          echo "已切换源码到 $REF（RELEASE=$(cat RELEASE)），构建层取自 $ORIG"

      - name: 构建（tier=${{ matrix.tier }}）
        run: |
          bash android/build.sh . out ${{ matrix.tier }}
          ls -la out/

      - name: 三重校验
        run: |
          SO=out/libffmpeg_bridge.so
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          READELF=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          # 1) JNI_OnLoad 导出（RegisterNatives 桥的唯一门面；没有它 = Java 无法加载）
          $NM -D $SO | grep -q "T JNI_OnLoad" || { echo "FAIL: JNI_OnLoad 未导出"; exit 1; }
          # 2) 4KB 页对齐（8KB/16KB 页设备向下兼容的关键）
          if $READELF -lW $SO | awk '/LOAD/ {gsub(/0x/,"",$NF); if (strtonum("0x"$NF) > 4096) bad=1} END {exit bad?1:0}'; then
            echo "OK: LOAD 段全部 <= 4096"
          else
            $READELF -lW $SO | grep LOAD
            echo "FAIL: 存在 >4096 对齐的 LOAD 段"; exit 1
          fi
          # 3) 组件清单存在且非空
          [ -s out/enabled-components.txt ] || { echo "FAIL: 组件清单为空"; exit 1; }
          echo "== 校验全部通过 =="

      - name: 重命名产物（带版本/档位/架构）
        run: |
          mkdir -p dist
          cp out/libffmpeg_bridge.so "dist/libffmpeg_bridge-${{ steps.ver.outputs.version }}-${{ matrix.tier }}-arm64.so"
          cp out/enabled-components.txt "dist/enabled-components-${{ steps.ver.outputs.version }}-${{ matrix.tier }}.txt"
          sha256sum dist/* > dist/SHA256SUMS

      - name: 上传 artifact（90 天）
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bridge-${{ steps.ver.outputs.version }}-${{ matrix.tier }}
          path: dist/

      - name: 发 Release（仅 common 档，min 档只进 artifact）
        if: matrix.tier == 'common' && !contains(steps.ver.outputs.tag, 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            FFmpeg ${{ steps.ver.outputs.ref }} 自动构建（Android arm64，4KB 页对齐，全页设备通用）。
            档位 common（全量解码+音频转码+滤镜）。min 档见 Actions artifact。
            校验：JNI_OnLoad ✓ / 4KB 对齐 ✓ / 组件清单见附件。
          files: dist/*
          fail_on_unmatched_files: true
